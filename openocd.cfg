# ============================================================================
# OpenOCD 配置 — Gimbal_2026 (STM32F103 中容量)
# 适配对象：山寨 ST-Link V2（银色铝壳 USB 棒，固件 V2J23S4，VID:PID 0483:3748）
#
# 【为什么不能直接用默认的 interface/stlink.cfg】
# OpenOCD 0.12 里 interface/stlink.cfg 用的是新的 "st-link"(dapdirect) 驱动，
# 只支持固件 >= V2J24 的 ST-Link。这根山寨棒子的固件是 V2J23S4（早于 V2J24），
# 实测会直接报：
#   Error: The firmware in the ST-Link adapter only supports deprecated HLA.
#   Error: Please consider updating the ST-Link firmware with a version ...
# 所以这里必须换用旧的 HLA 驱动：interface/stlink-hla.cfg。
# 等哪天把固件刷到 V2J24 以上，再把下面第 1 段换回 interface/stlink.cfg 即可。
# ============================================================================

# ---------------------------------------------------------------------------
# 1) 调试器：HLA 驱动（V2J23S4 固件下唯一能连通的方式，0.12 仍保留但标记弃用）
# ---------------------------------------------------------------------------
source [find interface/stlink-hla.cfg]

# ---------------------------------------------------------------------------
# 2) 接口：SWD
#    HLA 驱动下 0.12 接受 "swd" 这种写法（内部会映射到 hla_swd），
#    必须写在 source target 之前，否则目标已经按 JTAG 建好了。
# ---------------------------------------------------------------------------
transport select swd

# ---------------------------------------------------------------------------
# 3) 目标芯片
# ---------------------------------------------------------------------------
source [find target/stm32f1x.cfg]

# ---------------------------------------------------------------------------
# 4) 降速：默认 1.8 MHz 握不上手，降到 480 kHz。
#    原因：山寨 ST-Link 的 SWD 输出驱动能力弱 + 长杜邦线分布电容大，
#    1.8 MHz 下 SWCLK/SWDIO 边沿已经糊了，读回的数据偶发错位
#    （实测 1000 kHz 时会出现 "jtag status contains invalid mode value"，
#     480 kHz 下稳定）。
#    ！！注意顺序：HLA 驱动要求 adapter speed 写在 source target 之后才生效，
#    写在前面会被重置回 1000 kHz（实测），别挪位置。
#    如果 480 还是偶尔掉线，可以继续降到 240。
# ---------------------------------------------------------------------------
adapter speed 480

# ---------------------------------------------------------------------------
# 5) SRST 脉宽延时：给复位线 100 ms 建立时间（HLA 驱动接受此设置，无副作用）
# ---------------------------------------------------------------------------
adapter srst delay 100

# ---------------------------------------------------------------------------
# 6) 复位方式 —— 需要把 ST-Link 的 RST 脚接到板子的 RST 脚才启用！
#    没接 RST 就保持注释，否则连不上。
#    （另外：不要用 connect_assert_srst —— 它强依赖复位线，没接线时直接失败）
#
# reset_config srst_only srst_nogate
# ---------------------------------------------------------------------------

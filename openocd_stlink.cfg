# 选择调试器为stlink

# 这根山寨 ST-Link 的固件是 V2J23S4（早于 V2J24），新版 stlink.cfg 的 dapdirect 驱动
# 只支持 >= V2J24，会报 "only supports deprecated HLA"，所以必须改用旧的 HLA 驱动。
source [find interface/stlink-hla.cfg]
# source [find interface/jlink.cfg] #使用cmsis-dap硬件进行调试,注意其他地方也要更改
# OpenOCD作为GDB和硬件调试器的桥梁(为硬件提供抽象,把接口给GDB),支持多种硬件调试器.
# OpenOCD会自动在其根目录的share/openocd/scripts/interface里面寻找对应的配置文件

# 选择接口为SWD
transport select swd

# 选择目标芯片
source [find target/stm32f1x.cfg]
# OpenOCD会自动在其根目录的share/openocd/scripts/target里面寻找对应的配置文件
# 注意：HLA 驱动下 adapter speed 必须写在 source target 之后才生效，
# 写在前面会被重置回 1000 kHz，导致 "jtag status contains invalid mode value"。
adapter speed 480
